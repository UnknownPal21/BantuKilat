[project]
name = "backend"
version = "0.1.0"
description = "Ini adalah bagaian backend untuk project lomba yang bernama BantuKilat"
readme = "README.md"
authors = [{ name = "Danannme", email = "noragamiaragotoyato92@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi-cloud-cli>=0.28.0",
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Satu event loop untuk seluruh sesi: client Mongo dibuka sekali di conftest.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
