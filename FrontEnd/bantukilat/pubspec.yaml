name: bantukilat
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geocoding: ^5.0.1
  geolocator: ^14.1.2
  http: ^1.1.0
  flutter_secure_storage: 11.2.0
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.4
  flutter_svg: ^2.4.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
