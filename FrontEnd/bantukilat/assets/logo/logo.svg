<svg height="100%" viewBox="0 0 512 512" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"></stop>
      <stop offset="50%" stop-color="#064e3b"></stop>
      <stop offset="100%" stop-color="#047857"></stop>
    </linearGradient>
    <!-- Bolt Electric Gradient -->
    <linearGradient id="boltGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="25%" stop-color="#fef08a"></stop>
      <stop offset="65%" stop-color="#f59e0b"></stop>
      <stop offset="100%" stop-color="#d97706"></stop>
    </linearGradient>
    <!-- Circular Halo & Radar Gradient -->
    <linearGradient id="ringGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"></stop>
      <stop offset="50%" stop-color="#10b981"></stop>
      <stop offset="100%" stop-color="#059669"></stop>
    </linearGradient>
    <!-- Glow filter -->
    <filter height="160%" id="electricGlow" width="160%" x="-30%" y="-30%">
      <feGaussianBlur result="blur1" stdDeviation="8"></feGaussianBlur>
      <feGaussianBlur result="blur2" stdDeviation="18"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur2"></feMergeNode>
        <feMergeNode in="blur1"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter height="140%" id="softGlow" width="140%" x="-20%" y="-20%">
      <feGaussianBlur result="glow" stdDeviation="12"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="glow"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <style>
      @keyframes radarPulse {
        0% { r: 50px; opacity: 0.85; stroke-width: 3.5px; }
        50% { opacity: 0.45; }
        100% { r: 215px; opacity: 0; stroke-width: 1px; }
      }

      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes beaconBreathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(52, 211, 153, 0.85)); }
      }

      @keyframes lightningFlash {
        0%, 100% {
          transform: scale(1) translateY(0);
          filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8)) brightness(1);
        }
        45% {
          transform: scale(1) translateY(0);
          filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8)) brightness(1);
        }
        48% {
          transform: scale(1.08) translateY(-3px);
          filter: drop-shadow(0 0 30px #ffffff) brightness(1.6);
        }
        51% {
          transform: scale(0.97) translateY(2px);
          filter: drop-shadow(0 0 16px rgba(254, 240, 138, 0.9)) brightness(1.3);
        }
        54% {
          transform: scale(1.05) translateY(-2px);
          filter: drop-shadow(0 0 24px rgba(245, 158, 11, 1)) brightness(1.4);
        }
        58% {
          transform: scale(1) translateY(0);
          filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8)) brightness(1);
        }
      }

      @keyframes nodeOrbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .radar-pulse-1 { animation: radarPulse 3s cubic-bezier(0.1, 0.7, 0.3, 1) infinite; }
      .radar-pulse-2 { animation: radarPulse 3s cubic-bezier(0.1, 0.7, 0.3, 1) 1s infinite; }
      .radar-pulse-3 { animation: radarPulse 3s cubic-bezier(0.1, 0.7, 0.3, 1) 2s infinite; }

      .sweep-line {
        transform-origin: 256px 215px;
        animation: radarSweep 5s linear infinite;
      }

      .beacon-core {
        transform-origin: 256px 215px;
        animation: beaconBreathe 3.5s ease-in-out infinite;
      }

      .lightning-core {
        transform-origin: 256px 215px;
        animation: lightningFlash 3.2s ease-in-out infinite;
      }

      .orbiting-nodes {
        transform-origin: 256px 215px;
        animation: nodeOrbit 16s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas Container -->
  <rect fill="url(#bgGrad)" height="472" rx="108" width="472" x="20" y="20"></rect>
  <rect fill="none" height="464" rx="104" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" width="464" x="24" y="24"></rect>
  
  <!-- Neighborhood Radar Ripple Circles -->
  <circle class="radar-pulse-1" cx="256" cy="215" fill="none" r="50" stroke="#34d399"></circle>
  <circle class="radar-pulse-2" cx="256" cy="215" fill="none" r="50" stroke="#6ee7b7"></circle>
  <circle class="radar-pulse-3" cx="256" cy="215" fill="none" r="50" stroke="#a7f3d0"></circle>
  
  <!-- High-Tech Radar Scanning Arc Beam -->
  <g class="sweep-line">
    <path d="M 256 215 L 396 150 A 155 155 0 0 0 256 60 Z" fill="#34d399" fill-opacity="0.12"></path>
    <line stroke="#6ee7b7" stroke-opacity="0.7" stroke-width="2.5" x1="256" x2="396" y1="215" y2="150"></line>
  </g>
  
  <!-- Central Circular Protective Beacon Disc & Location Ring -->
  <g class="beacon-core">
    <circle cx="256" cy="215" fill="#047857" fill-opacity="0.3" filter="url(#softGlow)" r="142" stroke="url(#ringGrad)" stroke-width="3"></circle>
    <circle cx="256" cy="215" fill="none" r="126" stroke="#6ee7b7" stroke-dasharray="8 6" stroke-opacity="0.6" stroke-width="2"></circle>
    <circle cx="256" cy="215" fill="#064e3b" filter="url(#softGlow)" r="105" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3.5"></circle>
    <circle cx="256" cy="215" fill="#059669" fill-opacity="0.55" r="94"></circle>
    <line stroke="#6ee7b7" stroke-linecap="round" stroke-width="3" x1="256" x2="256" y1="62" y2="82"></line>
    <line stroke="#6ee7b7" stroke-linecap="round" stroke-width="3" x1="256" x2="256" y1="348" y2="368"></line>
    <line stroke="#6ee7b7" stroke-linecap="round" stroke-width="3" x1="103" x2="123" y1="215" y2="215"></line>
    <line stroke="#6ee7b7" stroke-linecap="round" stroke-width="3" x1="389" x2="409" y1="215" y2="215"></line>
  </g>
  
  <!-- Orbiting Neighborhood Helper Nodes -->
  <g class="orbiting-nodes">
    <g transform="translate(256, 73)">
      <circle cx="0" cy="0" fill="#fef08a" filter="url(#electricGlow)" r="7"></circle>
      <circle cx="0" cy="0" fill="none" r="12" stroke="#fef08a" stroke-opacity="0.5" stroke-width="1.5"></circle>
    </g>
    <g transform="translate(398, 215)">
      <circle cx="0" cy="0" fill="#34d399" r="6"></circle>
    </g>
    <g transform="translate(256, 357)">
      <circle cx="0" cy="0" fill="#fef08a" r="6.5"></circle>
    </g>
    <g transform="translate(114, 215)">
      <circle cx="0" cy="0" fill="#34d399" r="6"></circle>
    </g>
  </g>
  
  <!-- Central Electric Lightning Bolt -->
  <g class="lightning-core">
    <path d="M 284 100 L 174 238 L 246 238 L 220 355 L 348 198 L 274 198 Z" fill="#f59e0b" filter="url(#electricGlow)" opacity="0.5"></path>
    <path d="M 284 100 L 174 238 L 246 238 L 220 355 L 348 198 L 274 198 Z" fill="url(#boltGrad)" filter="url(#electricGlow)" stroke="#ffffff" stroke-linejoin="round" stroke-width="5"></path>
    <circle cx="260" cy="220" fill="#ffffff" filter="url(#electricGlow)" r="6"></circle>
    <polygon fill="#ffffff" opacity="0.65" points="278,122 202,228 250,228 238,272 274,204 266,204"></polygon>
  </g>
  
  <!-- Brand Name BantuKilat -->
  <g transform="translate(256, 442)">
    <text fill="#ffffff" font-family="&#39;Plus Jakarta Sans&#39;, system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="4" text-anchor="middle">
      BANTU<tspan fill="#fef08a">KILAT</tspan>
    </text>
  </g>
</svg>